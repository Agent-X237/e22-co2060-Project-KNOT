services:
  # -------------------------------------------------------------------
  # 1. Database Service: MySQL 8.0
  # -------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: knot-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: new_password
      MYSQL_DATABASE: knot_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./code/KNOT_Basement/Student_Portal/backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pnew_password" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. Student Portal Backend & 2-Step Verification Cron Engine
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./code/KNOT_Basement/Student_Portal/backend
      dockerfile: Dockerfile
    container_name: knot-student-backend
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${PORT:-5001}
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-new_password}
      DB_NAME: ${DB_NAME:-knot_db}
      JWT_SECRET: ${JWT_SECRET:-knot_super_secret_jwt_key_2026}
      EMAIL_USER: ${EMAIL_USER:-minhaj.dssc2@gmail.com}
      EMAIL_PASS: ${EMAIL_PASS:-wvvnkowdrbnfetva}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-minhaj.dssc2@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-wvvnkowdrbnfetva}
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------
  # 3. Maintenance System Backend
  # -------------------------------------------------------------------
  maintenance-backend:
    build:
      context: ./code/KNOT_Basement/maintenance_system/server
      dockerfile: Dockerfile
    container_name: knot-maintenance-backend
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${MAINTENANCE_PORT:-5003}
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-new_password}
      DB_NAME: ${DB_NAME:-knot_db}
      EMAIL_USER: ${EMAIL_USER:-minhaj.dssc2@gmail.com}
      EMAIL_PASS: ${EMAIL_PASS:-wvvnkowdrbnfetva}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-minhaj.dssc2@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-wvvnkowdrbnfetva}
    ports:
      - "5003:5003"
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------------------------
  # 4. React SPA Frontend & Nginx Proxy
  # -------------------------------------------------------------------
  frontend:
    build:
      context: ./code/KNOT_Basement/Student_Portal/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://backend.knotpdn.tech}
    container_name: knot-frontend
    restart: always
    env_file:
      - .env
    ports:
      - "5173:80"
    depends_on:
      - backend
      - maintenance-backend

  # -------------------------------------------------------------------
  # 5. Gateway Proxy Hub (Port 3000)
  # -------------------------------------------------------------------
  gateway:
    build:
      context: ./code/KNOT_Basement
      dockerfile: Dockerfile
    container_name: knot-gateway
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
    driver: local
